http:
  port: 8080

exchanges:
  enabled:
    - binance
    - mexc
    - kraken
    - okx

symbols:
  - BTCUSDT
  - ETHUSDT

websocket:
  reconnect_backoff_ms: 1000
  reconnect_max_attempts: 10

store:
  stale_threshold_ms: 10000
  # max wpisów na (exchange, symbol) w ring buffer
  history_capacity: 1000
